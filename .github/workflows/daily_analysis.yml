name: Live Market 30-Min Screener & Email Digest

on:
  schedule:
    # 1. Runs every 30 minutes during Indian Market Hours (9:15 AM to 3:30 PM IST, Mon-Fri) -> 03:45 UTC to 10:00 UTC
    - cron: '*/30 3-10 * * 1-5'
    # 2. Daily 3:00 AM IST pre-market run -> 21:30 UTC
    - cron: '30 21 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Live Google Sheet & Run Fast Stock Analyzer
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python import_gsheet.py
          python fast_runner.py
          python backtester.py

      - name: Commit and Push Updated Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add analysis_data.json analysis_data.js nifty250_data.json nifty250_data.js backtest_results.json backtest_results.js stocks.csv .nojekyll requirements.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update live market data [30-Min Schedule]" && git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git main)
