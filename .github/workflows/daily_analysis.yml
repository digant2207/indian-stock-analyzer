name: Daily 3 AM Stock Screener & Analysis

on:
  schedule:
    # Runs at 21:30 UTC every day = 3:00 AM IST
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run Fast Multi-Threaded Stock Analyzer
        run: |
          python fast_runner.py
          python backtester.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add analysis_data.json analysis_data.js nifty250_data.json nifty250_data.js backtest_results.json backtest_results.js stocks.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update daily stock intelligence [3 AM IST]" && git push)
